[package]
name = "gyroflow_core"
version = "0.1.0"
edition = "2021"

[dependencies]
nalgebra = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
# Add opencv dependency
opencv = { version = "0.86", features = ["imgproc", "video", "highgui"] } # Ensure these features are enabled for optical flow
