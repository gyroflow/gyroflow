name: Core tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/core -> target
      - name: Test portable core without optional GPU inference or native OpenCV
        run: cargo test --manifest-path src/core/Cargo.toml --locked --lib --release --config profile.release.package.gyroflow-core.opt-level=1 -j 2
