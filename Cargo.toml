[package]
name = "gyroflow"
version = "1.6.3"
authors = ["Adrian <adrian.eddy@gmail.com>", "Elvin Chen"]
edition = "2024"
build = "build.rs"

[features]
default = ["opencv", "ai-optical-flow"]
opencl = ["gyroflow-core/use-opencl"]
opencv = ["gyroflow-core/use-opencv"]
ai-optical-flow = ["gyroflow-core/use-burn"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
gyroflow-core = { path = "src/core/", features = ["use-opencv", "use-opencl"] }
system_shutdown = "4.1"
breakpad-sys = "0.2.0"
trash = "5.2"
# For nle_plugins
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
zip-extensions = { version = "0.14", default-features = false, features = ["deflate-flate2"] }
runas = "1.2"
tempfile = "3"
fs_extra = "1.3"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
gyroflow-core = { path = "src/core/", features = ["use-opencv"] }

[dependencies]
cstr = "0.2.12"
cpp = "0.5.11"
serde = "1.0"
serde_json = "1.0"
bytemuck = "1.25"
nalgebra = "0.34"
semver = "1.0.28"
fastrand = "2.1.0"
itertools = "0.15.0"
regex = "1.13"
rayon = "1.10"
mimalloc = { version = "0.1.50", default-features = false }

pollster = "1.0"
futures-intrusive = "0.5.0"
flate2 = "1.1"
walkdir = "2.5.0"
mp4-merge = "0.2.1"
human-sort = "0.2.2"
argh = "0.1.19"
indicatif = "0.18"
rustfft = "6.4.1"
crc32fast = "1.5.3"
rodio = { default-features = false, features = ["vorbis", "playback"], version = "0.23" }
filetime_creation = "0.2"

qmetaobject = { version = "0.2.10", default-features = false, features = ["log"] }
qttypes     = { version = "0.2.12", default-features = false, features = ["required", "qtquick", "qtquickcontrols2"]}
qml-video-rs = { git = "https://github.com/AdrianEddy/qml-video-rs.git", rev = "6c7e6ff" }
#qml-video-rs = { path = "../qml-video-rs" }

ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "filter", "format", "software-resampling", "software-scaling"] }
lazy_static = "1.5.0"
parking_lot = "0.13"

simplelog = "0.12.2"
log = "0.4"

ureq = "3.5"
url = "2.5.7"
whoami = "2.1"
tar = "0.4.45"
lru = "0.19"
chrono = "0.4"

keep-awake = { git = "https://github.com/AdrianEddy/keep-awake-rs.git", rev = "4f2a93f" }

[patch.crates-io]
qmetaobject = { git = "https://github.com/AdrianEddy/qmetaobject-rs.git", rev = "ff1e23d" }
qttypes     = { git = "https://github.com/AdrianEddy/qmetaobject-rs.git", rev = "ff1e23d" }

# cubecl 0.12.0-pre.1 + four fixes for AMD's Windows Vulkan driver (Radeon iGPUs), not upstreamed:
# storage mapped from the iGPU's largest device-local heap, a cooperative matrix zeroed as a
# composite, the subgroup size pinned where it can vary, and a finite tanh. Every cubecl crate comes
# from the branch, or its in-repo siblings would enter the graph twice.
cubecl                 = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-common          = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-core            = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-cpp             = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-cpu             = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-cuda            = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-environment     = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-hip             = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-ir              = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-llvm            = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-macros          = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-macros-internal = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-metal           = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-monitoring      = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-opt             = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-runtime         = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-server          = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-spirv           = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-std             = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-tile            = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-wgpu            = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
cubecl-zspace          = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-v0.12.0-pre.1" }
# burn 0.23.0-pre.1 + conv autotune that benchmarks conv_direct only where it can win (it ran
# 8-90x slower elsewhere, long enough for Windows to reset an iGPU).
burn                   = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-autodiff          = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-backend           = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-backend-extension = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-core              = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-cpu               = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-cubecl            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-cubecl-fusion     = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-cuda              = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-derive            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-dispatch          = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-einsum            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-flex              = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-fusion            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-instrument        = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-instrument-macros = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-ir                = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-linalg            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-nn                = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-optim             = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-pack              = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-remote            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-rocm              = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-router            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-signal            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-std               = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-store             = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-tensor            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-vision            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }
burn-wgpu              = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-v0.23.0-pre.1" }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [ "Win32_System_Com", "Win32_System_Console", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_Foundation", "Wdk_Foundation", "Win32_System_LibraryLoader",
             "Win32_Graphics_Dwm", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dxgi",
             "Win32_Security", "Win32_Security_Authorization", "Win32_System_WindowsProgramming", "Win32_System_Threading", "Win32_System_Registry",
             "Win32_Storage_Packaging_Appx", "Win32_Storage_FileSystem" ]

[target.'cfg(target_os = "macos")'.dependencies]
oslog = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3"

[build-dependencies]
cpp_build = "0.5.11"
winres = "0.1.12"
walkdir = "2.5.0"
cc = "1.7"

[[bin]]
name = "gyroflow"
path = "src/gyroflow.rs"

[profile.profile]
inherits = "release"
debug = true

[profile.deploy]
inherits = "release"
lto = true
codegen-units = 1

[dev-dependencies]
test-case = "3.4.0"

# -------------------------- Android stuff --------------------------

# [lib]
# crate-type = ["cdylib"]
# name = "gyroflow"
# path = "src/gyroflow.rs"

[package.metadata.android]
build_targets = [ "aarch64-linux-android" ]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk = { version = "0.9", features = ["media", "api-level-26"] }
ndk-sys = { version = "0.6.0" }
ndk-context = "0.1.1"

[profile.release.build-override]
opt-level = 2