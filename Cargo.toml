[package]
name = "gyroflow"
version = "1.7.0"
authors = ["Adrian <adrian.eddy@gmail.com>", "Elvin Chen"]
edition = "2024"
build = "build.rs"

[features]
default = ["opencv", "ai-optical-flow"]
opencl = ["gyroflow-core/use-opencl"]
opencv = ["gyroflow-core/use-opencv"]
ai-optical-flow = ["gyroflow-core/use-burn"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
gyroflow-core = { path = "src/core/", features = ["use-opencv", "use-opencl"] }
system_shutdown = "4.1"
breakpad-sys = "0.2.0"
trash = "5.2"
# For nle_plugins
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
zip-extensions = { version = "0.14", default-features = false, features = ["deflate-flate2"] }
runas = "1.2"
tempfile = "3"
fs_extra = "1.3"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
gyroflow-core = { path = "src/core/", features = ["use-opencv"] }

[dependencies]
cstr = "0.2.12"
cpp = "0.5.11"
serde = "1.0"
serde_json = "1.0"
bytemuck = "1.25"
nalgebra = "0.34"
semver = "1.0.28"
fastrand = "2.1.0"
itertools = "0.15.0"
regex = "1.13"
rayon = "1.10"
mimalloc = { version = "0.1.50", default-features = false }

pollster = "1.0"
futures-intrusive = "0.5.0"
flate2 = "1.1"
walkdir = "2.5.0"
mp4-merge = "0.2.1"
human-sort = "0.2.2"
argh = "0.1.19"
indicatif = "0.18"
rustfft = "6.4.1"
crc32fast = "1.5.5"
rodio = { default-features = false, features = ["vorbis", "playback"], version = "0.23" }
filetime_creation = "0.2"

qmetaobject = { version = "0.2.10", default-features = false, features = ["log"] }
qttypes     = { version = "0.2.12", default-features = false, features = ["required", "qtquick", "qtquickcontrols2"]}
qml-video-rs = { git = "https://github.com/AdrianEddy/qml-video-rs.git", rev = "3de7b68" }
#qml-video-rs = { path = "../qml-video-rs" }

ffmpeg-next = { version = "9.1.0", default-features = false, features = ["codec", "filter", "format", "software-resampling", "software-scaling"] }
lazy_static = "1.5.0"
parking_lot = "0.13"

simplelog = "0.12.2"
log = "0.4"

ureq = "3.5"
url = "2.5.7"
whoami = "2.1"
tar = "0.4.45"
lru = "0.19"
chrono = "0.4"

keep-awake = { git = "https://github.com/AdrianEddy/keep-awake-rs.git", rev = "4f2a93f" }

[patch.crates-io]
qmetaobject = { git = "https://github.com/AdrianEddy/qmetaobject-rs.git", rev = "ff1e23d" }
qttypes     = { git = "https://github.com/AdrianEddy/qmetaobject-rs.git", rev = "ff1e23d" }

# cubecl at the rev burn and cubek pin (6c9af8de) + four fixes for AMD's Windows Vulkan driver
# (Radeon iGPUs), not upstreamed: storage mapped from the iGPU's largest device-local heap, a
# cooperative matrix zeroed as a composite, the subgroup size pinned where it can vary, and a finite
# tanh. Plus two more: a comptime enum's variant hashed into its kernel's cache key, and a
# multi-dimensional cube run as a one-dimensional workgroup (Intel's Arc walked 2-D workgroups in
# tiles, so planes mixed rows). Then the thread id read through the syscall, not glibc's `gettid`
# (2.30+: the Linux build links against an older glibc), and a cached autotune winner that does not
# launch on a member of its key's bucket giving way to the plan instead of panicking; and the Metal
# runtime's device-wide memory report and cleanup covering every stream, not only the calling
# thread's. burn and cubek name cubecl by git URL, so the patch keys on it. Every
# cubecl crate comes from the branch, or its in-repo siblings would enter the graph twice.
[patch."https://github.com/tracel-ai/cubecl"]
cubecl                 = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-common          = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-core            = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-cpp             = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-cpu             = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-cuda            = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-environment     = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-hip             = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-ir              = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-llvm            = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-macros          = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-macros-internal = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-metal           = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-monitoring      = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-opt             = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-runtime         = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-server          = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-spirv           = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-std             = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-tile            = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-wgpu            = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }
cubecl-zspace          = { git = "https://github.com/AdrianEddy/cubecl.git", branch = "diem/fixes-6c9af8de" }

# burn main (aa57952d) + conv autotune that benchmarks conv_direct only where it can win (it ran
# 1-2 s a sample on a Radeon iGPU and lost the device to Windows' 2 s timeout).
[patch."https://github.com/tracel-ai/burn"]
burn                   = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-autodiff          = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-backend           = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-backend-extension = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-core              = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-cpu               = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-cubecl            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-cubecl-fusion     = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-cuda              = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-derive            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-dispatch          = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-einsum            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-flex              = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-fusion            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-instrument        = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-instrument-macros = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-ir                = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-linalg            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-nn                = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-optim             = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-pack              = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-remote            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-rocm              = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-router            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-signal            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-std               = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-store             = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-tensor            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-vision            = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }
burn-wgpu              = { git = "https://github.com/AdrianEddy/burn.git", branch = "diem/fixes-aa57952d" }

# cubek at the rev burn pins (47e93a9a) + the matmul autotune holding a cube to four planes where planes
# are wider than 32 lanes and on a GPU of at most 16 compute units: at wave64 the 8- and 16-plane
# settings took up to 1.56 s a dispatch on a Radeon iGPU, and a cold tune lost the device. And a float product's k and n tune-keyed by the power of
# two above them, as m is: keyed exactly, an attention's sequence length made every new length a new
# set of keys to tune.
[patch."https://github.com/tracel-ai/cubek"]
cubek                    = { git = "https://github.com/AdrianEddy/cubek.git", branch = "diem/fixes-47e93a9a" }
cubek-attention          = { git = "https://github.com/AdrianEddy/cubek.git", branch = "diem/fixes-47e93a9a" }
cubek-attention-backward = { git = "https://github.com/AdrianEddy/cubek.git", branch = "diem/fixes-47e93a9a" }
cubek-convolution        = { git = "https://github.com/AdrianEddy/cubek.git", branch = "diem/fixes-47e93a9a" }
cubek-fft                = { git = "https://github.com/AdrianEddy/cubek.git", branch = "diem/fixes-47e93a9a" }
cubek-interpolate        = { git = "https://github.com/AdrianEddy/cubek.git", branch = "diem/fixes-47e93a9a" }
cubek-matmul             = { git = "https://github.com/AdrianEddy/cubek.git", branch = "diem/fixes-47e93a9a" }
cubek-microkernel        = { git = "https://github.com/AdrianEddy/cubek.git", branch = "diem/fixes-47e93a9a" }
cubek-pool               = { git = "https://github.com/AdrianEddy/cubek.git", branch = "diem/fixes-47e93a9a" }
cubek-quant              = { git = "https://github.com/AdrianEddy/cubek.git", branch = "diem/fixes-47e93a9a" }
cubek-random             = { git = "https://github.com/AdrianEddy/cubek.git", branch = "diem/fixes-47e93a9a" }
cubek-reduce             = { git = "https://github.com/AdrianEddy/cubek.git", branch = "diem/fixes-47e93a9a" }
cubek-std                = { git = "https://github.com/AdrianEddy/cubek.git", branch = "diem/fixes-47e93a9a" }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [ "Win32_System_Com", "Win32_System_Console", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_Foundation", "Wdk_Foundation", "Win32_System_LibraryLoader",
             "Win32_Graphics_Dwm", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dxgi",
             "Win32_Security", "Win32_Security_Authorization", "Win32_System_WindowsProgramming", "Win32_System_Threading", "Win32_System_Registry",
             "Win32_Storage_Packaging_Appx", "Win32_Storage_FileSystem" ]

[target.'cfg(target_os = "macos")'.dependencies]
oslog = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3"

[build-dependencies]
cpp_build = "0.5.11"
winres = "0.1.12"
walkdir = "2.5.0"
cc = "1.11"

[[bin]]
name = "gyroflow"
path = "src/gyroflow.rs"

[profile.profile]
inherits = "release"
debug = true

[profile.deploy]
inherits = "release"
lto = true
codegen-units = 1

[dev-dependencies]
test-case = "3.4.0"

# -------------------------- Android stuff --------------------------

# [lib]
# crate-type = ["cdylib"]
# name = "gyroflow"
# path = "src/gyroflow.rs"

[package.metadata.android]
build_targets = [ "aarch64-linux-android" ]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk = { version = "0.9", features = ["media", "api-level-26"] }
ndk-sys = { version = "0.6.0" }
ndk-context = "0.1.1"

[profile.release.build-override]
opt-level = 2